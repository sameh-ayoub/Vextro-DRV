plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sameh.drover'
    compileSdk 34

    defaultConfig {
        applicationId "com.sameh.drover"
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
}
